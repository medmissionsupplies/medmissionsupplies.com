server {
    listen 8080;
    server_name medmissionsupplies.com www.medmissionsupplies.com;
    root /srv/site/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://medmissionsupplies.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
