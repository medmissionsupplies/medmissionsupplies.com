name: Verify MMS release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: new-site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: new-site
      - name: Test and render every share image on Linux
        run: npm test && npm run images:social -- --force && npm run build
        working-directory: new-site
